fr:
  date:
    formats:
      default: "%d/%m/%Y"
      long: "%e %B %Y"
    month_names: [~, janvier, février, mars, avril, mai, juin, juillet, août, septembre, octobre, novembre, décembre]
    abbr_month_names: [~, janv., févr., mars, avr., mai, juin, juil., août, sept., oct., nov., déc.]
    day_names: [dimanche, lundi, mardi, mercredi, jeudi, vendredi, samedi]
    abbr_day_names: [dim, lun, mar, mer, jeu, ven, sam]
  number:
    format:
      separator: ","
      delimiter: " "
  errors:
    format: "%{attribute} : %{message}"
    messages:
      blank: doit être renseigné
      taken: est déjà utilisé
      invalid: n'est pas valide
      not_a_number: n'est pas un nombre
      not_an_integer: doit être un nombre entier
      inclusion: n'est pas une valeur retenue
      record_invalid: "La validation a échoué : %{errors}"
  activerecord:
    attributes:
      roundabout:
        junction_type: Régime de priorité
        junction_type/roundabout: À l'anneau (carrefour à sens giratoire)
        junction_type/circular: À l'entrant (rond-point)
      photo:
        taken_on: Date de prise de vue
        image: Photographie
        author: Auteur
        licence: Licence
        source_url: Adresse de la source
    errors:
      models:
        photo:
          attributes:
            image:
              blank: doit être jointe
